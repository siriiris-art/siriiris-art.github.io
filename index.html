<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Product Store</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* Target by ID (#) */
    #page-header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 6px;
    }

    /* Target by Class (.) */
    .card {
      border: 2px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    /* Combining Classes */
    .featured {
      border-color: #f39c12;
      background-color: #fffdf0;
    }
    .products {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .products th,
    .products td {
      border: 1px solid #d46e6e;
      padding: 12px;
      text-align: left;
      color: #a5404088;
    }
  </style>
</head>
<body>

  <header id="page-header">
    <h1>My Product Store</h1>
  </header>

  <div class="card">
    <h3>Standard Product</h3>
    <p>This is a regular item card.</p>
  </div>

  <div class="card featured">
    <h3>Special Product</h3>
    <p>This item has two classes applied to it!</p>
  </div>
</div>
<a href="https://www.example.com" target="_blank">
  <div class="clickable-box">
    Click me to go to another page!
  </div>
</a>

  <table class="products">
    <tr>
      <th>Product</th>
      <th>Price</th>
    </tr>
    <tr>
      <td>Standard Product</td>
      <td>$10.00</td>
    </tr>
    <tr>
      <td>Special Product</td>
      <td>$20.00</td>
    </tr>
  </table>
</body>
</html>
